spring.application.name=gridweaver

server.port=8081
spring.threads.virtual.enabled=true

# GridWeaver Simulator Configuration
gridweaver.simulator.enabled=true
gridweaver.simulator.device-count=10000
gridweaver.simulator.interval-ms=1000

# GridWeaver State Machine Thresholds (simulated control values)
gridweaver.grid.discharge-threshold=80.0
gridweaver.grid.charge-threshold=40.0
gridweaver.grid.temp-fault-threshold=50.0
gridweaver.devices.offline-timeout-seconds=15
